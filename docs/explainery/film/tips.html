function render(t){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle=C.ivory;g.fillRect(0,0,W,H);
  const tA=TL.A.b,XF=0.32;if(t<tA+XF)scene("A",t,1);if(t>=tA)scene("B",t,ease((t-tA)/XF));
  // jasne tło pod nagłówek i logo. Przy pełnoekranowych kadrach: szerokie, półprzezroczyste i łagodnie wygaszane
  // (obraz ma prześwitywać), po hooku zwija się do okolic logo – chyba że na ekranie jest karta z nagłówkiem
  {const F=TL.full,k=F&&!TL.card?ease((t-tA)/0.6):0,hgH=F?lerp(1040,640,k):790,a0=F?lerp(0.9,0.72,k):1,hg=g.createLinearGradient(0,0,0,hgH);
   const st=F?[[0,1],[0.3,0.94],[0.5,0.74],[0.68,0.44],[0.84,0.17],[1,0]]:[[0,1],[0.78,0.95],[1,0]];st.forEach(([o,v])=>hg.addColorStop(o,`rgba(251,249,245,${a0*v})`));g.fillStyle=hg;g.fillRect(0,0,W,hgH)}
  const mg=TL.cta.type==="magnet",mo=mg?1-ease((t-TL.cta.t0+0.1)/0.3):1;
  if(t<tA+0.1){const out=1-ease((t-(tA-0.22))/0.22);headline(TL.hook.lines,TL.hook.pill,TL.hook.times,t,out,372)}
  if(t>=tA){const cd=TL.card,bb=TL.bubble;
    if(cd&&t>=cd.t0-0.05){const co=bb?1-ease((t-bb.t0+0.3)/0.25):1;headline(cd.lines,cd.pill,cd.lines.map((_,i)=>cd.t0+i*0.28),t,co*mo,400)}
    bubble(t,mo)}
  for(const cp of TL.caps){ if(t<cp.a-0.05||t>cp.b+0.2)continue;const ain=easeOut((t-cp.a)/0.16),aout=1-ease((t-cp.b-0.02)/0.16);caption(cp.words,t,Math.min(ain,aout)*mo,(1-ain)*14)}
  if(mg)magnet(t);else cta(t);
  if(t>=tA)logo(t,TL.logoAt);tag(t)}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
window.setup=async(tl)=>{TL=tl;for(const k of ["A","B"])IM[k]=await loadImg(`clips/${tl[k].img}/f0001.jpg`);if(tl.cta.cover)COVER=await loadImg(`covers/${tl.cta.cover}.png`);
  await Promise.all(['600 50px "Inter V"','700 50px "Inter V"','800 46px "Inter V"','500 24px "Inter V"','600 84px "Fraunces V"','700 30px "Inter V"','500 30px "Inter V"'].map(f=>document.fonts.load(f,"Żółć ąę DUO.pl® „”")));await document.fonts.ready;return true};
// klatki klipu: A – liniowo; B – jeden przebieg z wyhamowaniem (bez zapętlania), z przenikaniem sąsiednich klatek
window.renderAt=async(t)=>{for(const k of ["A","B"]){const sc=TL[k],c=sc.clip;if(!c||c.n<2||t<sc.a-0.01||t>sc.b+0.4)continue;const u=Math.max(0,t-sc.a);
    let ph=k==="A"?Math.min(u,c.dur):c.dur*(1-Math.exp(-u/sc.tau));const pos=Math.min(c.n-1,ph*c.fps),i=Math.floor(pos),f=pos-i;
    const src=n=>`clips/${sc.img}/f${String(Math.min(c.n,n+1)).padStart(4,"0")}.jpg`;try{const [i0,i1]=await Promise.all([loadImg(src(i)),f>0.02?loadImg(src(i+1)):null]);FR[k]={i0,i1,f}}catch(e){delete FR[k]}}
  render(t)};
window.guides=()=>{g.strokeStyle="rgba(255,0,80,.8)";g.lineWidth=3;g.setLineDash([14,10]);g.strokeRect(SAFE.l,SAFE.t,SAFE.r-SAFE.l,SAFE.b-SAFE.t);g.setLineDash([])};
