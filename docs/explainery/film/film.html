<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter V";font-weight:100 900;src:url("fonts/inter-latin-wght-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199}
@font-face{font-family:"Inter V";font-weight:100 900;src:url("fonts/inter-latin-ext-wght-normal.woff2") format("woff2");unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0}
@font-face{font-family:"Fraunces V";font-weight:100 900;src:url("fonts/fraunces-latin-wght-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199}
@font-face{font-family:"Fraunces V";font-weight:100 900;src:url("fonts/fraunces-latin-ext-wght-normal.woff2") format("woff2");unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Film DUO „Mgła” 1080×1920. Strefy bezpieczne Reels: góra 270 px, dół 480 px, lewa 90 px, prawa 180 px –
// napisy i logo wyłącznie w polu x 90–900, y 270–1440; kadry mają tam też wszystkie postaci.
const W=1080,H=1920,SAFE={l:90,r:900,t:270,b:1440},CX=540;
const C={ivory:"#fbf9f5",forest:"#36493d",clay:"#a9512f",rose:"#e07f78",sage:"#97ac9c",ink:"#262b27",sand:"#eadccb",muted:"#6a605a"};
const cv=document.getElementById("c"),G0=cv.getContext("2d");let g=G0;const OFF=new OffscreenCanvas(1080,1920),OG=OFF.getContext("2d");
const HARD=new Set(["s02a","s02b","s02c","s04a","s04b","s04c"]);let TL=null;const IM={},FR={};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,x)=>a+(b-a)*x;
// ruch kamery na kadr: [skala0, skala1, dx0, dy0, dx1, dy1] (dx,dy w px ekranu)
const KB={s01:[1.0,1.04,0,0,0,-8],s02a:[1.05,1.16,0,0,0,-10],s02b:[1.16,1.05,0,-10,0,0],s02c:[1.05,1.16,0,0,0,-10],s03a:[1.04,1.2,0,0,-70,-20],s03:[1.04,1.34,0,0,0,-30],s03c:[1.14,1.04,-20,0,0,0],s04:[1.1,1.03,0,-16,0,0],s04a:[1.05,1.15,0,0,0,-10],s04b:[1.15,1.05,0,-10,0,0],s04c:[1.05,1.15,0,0,0,-10],s05b:[1.04,1.14,0,0,-20,-10],s11b:[1.12,1.03,0,-16,0,0],s11c:[1.04,1.12,0,0,0,-12],s05:[1.03,1.1,-10,0,-24,-10],
  s06:[1.16,1.04,0,-30,0,0],s07:[1.04,1.1,0,0,-12,-12],s08:[1.08,1.03,12,0,-6,0],s09:[1.04,1.12,0,0,0,-18],s10:[1.12,1.02,0,-26,0,0],
  s11:[1.03,1.09,0,0,0,-16],s12:[1.09,1.03,-14,0,10,0],s13:[1.03,1.0,0,0,0,0]};
let PUNCH=0,HSC=1;function xf(name,p){const k=KB[name],e=ease(p),s=lerp(k[0],k[1],e)*1.5*(name==="s01"?(1+0.22*PUNCH)*HSC:1);return{s,x:W/2-360*s+lerp(k[2],k[4],e),y:H/2-640*s+lerp(k[3],k[5],e)}}
let SHIFT={s01:120},SHIFTX={s01:-70},SPLIT=0,ZC=470;const DXS=d=>(d<0?50:44)*SPLIT;const zig=y=>ZC+16*Math.sin(y*0.071)+9*Math.sin(y*0.23+1.3)+5*Math.sin(y*0.61);
function drawShot(name,p,a){if(a<=0)return;const m=xf(name,p),sy=SHIFT[name]||0,img=FR[name]||IM[name];m.x+=SHIFTX[name]||0;
  const edge=(ex)=>{const eg=g.createLinearGradient(ex-150,0,ex,0);eg.addColorStop(0,"rgba(251,249,245,0)");eg.addColorStop(1,"rgba(251,249,245,1)");g.fillStyle=eg;g.fillRect(ex-150,0,150,H);g.fillStyle=C.ivory;g.fillRect(ex-1,0,W-ex+200,H)};
  const vedge=(y0,y1)=>{if(HSC>=1)return;let vg=g.createLinearGradient(0,y1-200,0,y1);vg.addColorStop(0,"rgba(251,249,245,0)");vg.addColorStop(1,"rgba(251,249,245,1)");g.fillStyle=vg;g.fillRect(0,y1-200,W,200);g.fillStyle=C.ivory;g.fillRect(0,y1-1,W,H);
    vg=g.createLinearGradient(0,y0,0,y0+160);vg.addColorStop(0,"rgba(251,249,245,1)");vg.addColorStop(1,"rgba(251,249,245,0)");g.fillStyle=vg;g.fillRect(0,y0,W,160);g.fillStyle=C.ivory;g.fillRect(0,0,W,Math.max(0,y0+1))};
  if(name==="s01"&&SPLIT>0.001){ // kadr rozrywa się na dwie połowy, które odjeżdżają od siebie
    for(const d of [-1,1]){const dx=DXS(d);g.save();g.translate(ZC,1250);g.rotate(d*0.014*SPLIT);g.translate(-ZC,-1250);g.beginPath();g.moveTo(d*1400+ZC,-100);for(let y=-100;y<=H+100;y+=10)g.lineTo(zig(y)+d*dx,y);g.lineTo(d*1400+ZC,H+100);g.closePath();
      g.save();g.clip();g.globalAlpha=a;g.drawImage(img,m.x+d*dx,m.y+sy,720*m.s,1280*m.s);if(d>0){g.globalAlpha=1;edge(m.x+d*dx+720*m.s)}g.restore();
      g.globalAlpha=a*SPLIT;g.beginPath();for(let y=300;y<=1500;y+=10)y===300?g.moveTo(zig(y)+d*dx,y):g.lineTo(zig(y)+d*dx,y);g.strokeStyle="rgba(255,255,255,.95)";g.lineWidth=7;g.stroke();g.strokeStyle="rgba(110,80,55,.28)";g.lineWidth=2;g.stroke();g.restore()}
    g.globalAlpha=1;vedge(m.y+sy,m.y+sy+1280*m.s);return}
  g.globalAlpha=a;g.drawImage(img,m.x,m.y+sy,720*m.s,1280*m.s);g.globalAlpha=1;if(name==="s01"){edge(m.x+720*m.s);vedge(m.y+sy,m.y+sy+1280*m.s)}}
const pt=(name,p,fx,fy)=>{const m=xf(name,p);return[m.x+(SHIFTX[name]||0)+fx*720*m.s,m.y+(SHIFT[name]||0)+fy*1280*m.s]};

function fog(t,amt,bandY=980,spread=620){ if(amt<=0.003)return;
  for(let i=0;i<9;i++){const ph=i*1.7,x=W*(0.5+0.62*Math.sin(t*0.11+ph)*Math.cos(ph*0.7)),y=bandY+spread*0.55*Math.sin(t*0.07+ph*1.3),r=420+140*Math.sin(t*0.09+ph*2.1);
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(240,240,236,${0.34*amt})`);gr.addColorStop(0.55,`rgba(236,238,234,${0.2*amt})`);gr.addColorStop(1,"rgba(236,238,234,0)");
    g.fillStyle=gr;g.fillRect(0,0,W,H)}
  g.fillStyle=`rgba(232,234,230,${0.16*amt})`;g.fillRect(0,0,W,H)}
function glow(x,y,r,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(255,228,160,${a})`);gr.addColorStop(1,"rgba(255,228,160,0)");g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function wrap(text,maxW){const words=text.split(" ");const lines=[];let cur="";for(const w of words){const t=cur?cur+" "+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}

function caption(text,a,dy){ if(a<=0)return;
  g.font='600 52px "Inter V"';g.textAlign="center";g.textBaseline="middle";
  const lines=wrap(text,650),lh=68,w=Math.max(...lines.map(l=>g.measureText(l).width))+84,h=lines.length*lh+46,cy=1326+dy;
  g.globalAlpha=a;g.shadowColor="rgba(60,45,30,.22)";g.shadowBlur=34;g.shadowOffsetY=10;g.fillStyle="rgba(251,249,245,.96)";rr(CX-w/2,cy-h/2,w,h,36);g.fill();
  g.shadowColor="transparent";g.shadowBlur=0;g.shadowOffsetY=0;g.fillStyle=C.ink;lines.forEach((l,i)=>g.fillText(l,CX,cy-(lines.length-1)*lh/2+i*lh+2));g.globalAlpha=1}

function title(lines,t0,t,opts={}){ // duży tytuł w górnej części pola bezpiecznego
  const size=opts.size||88,lh=size*1.12,y0=opts.y||330;g.textAlign="center";g.textBaseline="middle";
  lines.forEach((ln,i)=>{const [txt,col,delay]=ln;const a=easeOut((t-t0-(delay||0))/0.45);if(a<=0)return;
    g.globalAlpha=a*(opts.alpha??1);g.font=`${opts.weight||600} ${size}px "Fraunces V"`;g.fillStyle=col;g.fillText(txt,CX,y0+i*lh+(1-a)*26)});g.globalAlpha=1}

const BODY=new Path2D("M0.5 11.7H3.5C12 11.7 18.6 18.6 18.6 26.4C18.6 34.6 12.3 41 4.6 41H1.6A1.1 1.1 0 0 1 0.5 39.9Z"),BOWL=new Path2D("M20.6 26.7H49.6A14.5 14.3 0 0 1 20.6 26.7Z");
function lg(a,b){const gr=g.createLinearGradient(0,0,71,42);gr.addColorStop(0,a);gr.addColorStop(1,b);return gr}
function logo(cx,cy,w,a,parts=[1,1,1]){ if(a<=0)return;const s=w/71;g.save();g.translate(cx-w/2,cy-21*s);g.scale(s,s);
  g.globalAlpha=a*parts[0];g.fillStyle=lg("#D6845F","#A55536");g.beginPath();g.arc(7,4.9,4.8,0,7);g.fill();g.fillStyle=lg("#E2A07F","#A9512F");g.fill(BODY);
  g.globalAlpha=a*parts[1];g.fillStyle=lg("#ECDCCB","#B89B7F");g.fill(BOWL);
  g.globalAlpha=a*parts[2];g.fillStyle=lg("#7A9686","#3B5A4A");g.beginPath();g.arc(64,4.9,4.8,0,7);g.fill();g.save();g.transform(-1,0,0,1,71,0);g.fillStyle=lg("#97AC9C","#2D4939");g.fill(BODY);g.restore();
  g.restore();g.globalAlpha=1}

function chip(x,y,lines,col,a){ if(a<=0)return;g.font='600 38px "Inter V"';g.textAlign="center";g.textBaseline="middle";
  const w=Math.max(...lines.map(l=>g.measureText(l).width))+50,h=lines.length*46+32;g.globalAlpha=a;
  g.shadowColor="rgba(60,45,30,.25)";g.shadowBlur=24;g.shadowOffsetY=8;g.fillStyle=col;rr(x-w/2,y-h/2+(1-a)*18,w,h,26);g.fill();g.shadowColor="transparent";g.shadowBlur=0;g.shadowOffsetY=0;
  g.fillStyle="#fff";lines.forEach((l,i)=>g.fillText(l,x,y-(lines.length-1)*23+i*46+2+(1-a)*18));g.globalAlpha=1;return h}

const HKD={lines:["Żyjesz z mężem","jak ze","współlokatorem?"],pill:2,dur:2.5,rings:[[0.195,0.478],[0.83,0.482]]};
function HK(){const h=TL.hook||HKD,n=h.lines.length,times=h.lines.map((_,i)=>i?0.2+h.dur*(i/n)*0.5:0);return{...h,times,tear:times[n-1]+0.45}}
function render(t){
  PUNCH=1-easeOut(t/0.75);{const x=clamp((t-HK().tear)/0.6);SPLIT=x<=0?0:easeOut(x)+0.18*Math.sin(Math.PI*x)*(1-x)}
  const E=TL.ev;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle=C.ivory;g.fillRect(0,0,W,H);
  // ––– kadry z przenikaniem –––
  const XF=0.7;let cur=null;
  for(const [name,a,b] of TL.shots){ if(t<a-0.001||t>b+XF)continue;const p=(t-a)/(b+XF-a);
    const fadeIn=(name==="s01"||HARD.has(name))?1:ease((t-a)/XF);drawShot(name,p,fadeIn);if(t<=b)cur=[name,p,a,b]}
  const sh=n=>TL.shots.find(s=>s[0]===n);
  // ––– mgła –––
  let amt=0;const s3=sh("s03"),s4=sh("s04"),s5=sh("s05"),s6=sh("s06"),s10=sh("s10");
  if(t>=s3[1]-0.6&&t<s5[1]) amt=lerp(0,0.62,ease((t-(s3[1]-0.6))/3.2))*(1-ease((t-(s5[1]-0.5))/0.9));
  if(t>=s6[1]&&t<s6[2]+0.7) amt=Math.max(amt,lerp(0.55,0.2,ease((t-s6[1])/(s6[2]-s6[1])))*(1-ease((t-s6[2])/0.7)));
  if(t>=s10[1]-0.2&&t<s10[1]+3.4) amt=Math.max(amt,0.95*(1-ease((t-s10[1]-0.3)/2.9))); // mgła opada
  fog(t,amt);
  if(t>=s6[1]&&t<s6[2]+0.5){const p=(t-s6[1])/(s6[2]+0.7-s6[1]),[gx,gy]=pt("s06",p,0.5,0.385);glow(gx,gy,330,(0.3+0.12*Math.sin(t*3.1))*ease((t-s6[1])/0.8)*(1-ease((t-s6[2])/0.5)))}

  // ––– hook: nagłówek wchodzi słowo po słowie, ostatnie słowo w plakietce; na scenie – dystans między nimi –––
  if(t<E.hook[1]+0.6&&t<sh("s01")[2]){const out=1-ease((t-E.hook[1])/0.5),p1=(t-0)/(sh("s01")[2]+XF);
    const hg=g.createLinearGradient(0,0,0,780);hg.addColorStop(0,`rgba(251,249,245,${out})`);hg.addColorStop(0.8,`rgba(251,249,245,${0.96*out})`);hg.addColorStop(1,"rgba(251,249,245,0)");g.fillStyle=hg;g.fillRect(0,0,W,780);
    const pop=(t0,d=0.38)=>{const x=clamp((t-t0)/d);return t0<=0?1+0.1*(1-easeOut(t/0.6)):x<=0?0:1+0.16*Math.sin(Math.PI*x)*(1-x)-(1-easeOut(x))*0.35};
    g.textAlign="center";g.textBaseline="middle";const hk=HK();
    {g.font='600 88px "Fraunces V"';const wmax=Math.max(1,...hk.lines.filter((_,i)=>i!==hk.pill).map(l=>g.measureText(l).width)),fs=Math.min(88,88*710/wmax);
     g.font='600 72px "Fraunces V"';const pw=g.measureText(hk.lines[hk.pill]||"").width,ps=Math.min(72,72*610/Math.max(1,pw));let y=372;
     hk.lines.forEach((txt,i)=>{const isP=i===hk.pill,t0=hk.times[i];if(isP&&i)y+=14;const yy=y;y+=isP?112:98;
       if(!isP){const sc=pop(t0);if(sc<=0)return;g.save();g.translate(CX,yy);g.scale(sc,sc);g.globalAlpha=out*(i?clamp((t-t0)/0.15):1);g.font=`600 ${fs}px "Fraunces V"`;g.fillStyle=C.forest;g.fillText(txt,0,0);g.restore();return}
       const sc=i?pop(t0,0.45):pop(0);if(sc<=0)return;g.save();g.translate(CX,yy);g.rotate(-0.035);g.scale(sc,sc);g.globalAlpha=out*(i?clamp((t-t0)/0.12):1);g.font=`600 ${ps}px "Fraunces V"`;const w=g.measureText(txt).width+64;
       g.shadowColor="rgba(120,60,30,.3)";g.shadowBlur=30;g.shadowOffsetY=12;g.fillStyle=C.clay;rr(-w/2,-62,w,124,30);g.fill();g.shadowColor="transparent";g.shadowBlur=0;g.shadowOffsetY=0;g.fillStyle="#fff";g.fillText(txt,0,4);g.restore()})}
    g.globalAlpha=1;
    // dystans: przerywana linia przez środek sofy i strzałki rozchodzące się na boki
    {const t0=hk.tear,a=easeOut((t-t0)/0.5)*out;if(a>0){const [,y1]=pt("s01",p1,0.5,0.46),[,y2]=pt("s01",p1,0.5,0.6),ym=(y1+y2)/2,mx=ZC;
      g.globalAlpha=a*0.95;g.lineCap="round";
      const push=22+16*(0.5+0.5*Math.sin(t*5.2));[-1,1].forEach(d=>{const x0=mx+d*(12+DXS(d)),x1=mx+d*((26+push*0.6)*a+12+DXS(d));g.strokeStyle="#fff";g.lineWidth=14;g.lineJoin="round";
        for(const [col,lw] of [["#fff",15],[C.clay,8]]){g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.moveTo(x0,ym);g.lineTo(x1,ym);g.moveTo(x1-d*26,ym-24);g.lineTo(x1,ym);g.lineTo(x1-d*26,ym+24);g.stroke()}});
      g.globalAlpha=1}}
    // telefony: pulsujące kręgi powiadomień
    (hk.rings||[]).forEach(([fx,fy],ri)=>{const ph=ri*0.45;let [px,py]=pt("s01",p1,fx,fy);px+=(fx<0.5?-1:1)*DXS(fx<0.5?-1:1);for(let k=0;k<2;k++){const c=((t*0.9+ph+k*0.5)%1);g.globalAlpha=(1-c)*0.75*out*clamp(t/0.3);g.strokeStyle="#fff";g.lineWidth=6*(1-c)+2;g.beginPath();g.arc(px,py,14+c*58,0,7);g.stroke()}});g.globalAlpha=1}

  // ––– trzy drogi: etykiety nad krajobrazem –––
  if(t>=E.roads[0]-0.1&&t<E.roadsEnd+0.5&&cur){const out=1-ease((t-E.roadsEnd)/0.4),p=(t-s10[1])/(s10[2]+XF-s10[1]);
    const R=[[205,["Odbudowa"],C.rose,[0.175,0.325]],[462,["Czas","na decyzję"],C.clay,[0.5,0.315]],[748,["Rozstanie","z szacunkiem"],C.forest,[0.83,0.34]]];
    R.forEach(([x,lines,col,f],i)=>{const a=easeOut((t-E.roads[i])/0.5)*out;if(a<=0)return;const [tx,ty]=pt("s10",p,f[0],f[1]);
      g.globalAlpha=a*0.9;g.strokeStyle=col;g.lineWidth=5;g.lineCap="round";g.setLineDash([2,14]);g.beginPath();g.moveTo(x,468);g.lineTo(lerp(x,tx,a),lerp(468,ty-26,a));g.stroke();g.setLineDash([]);g.globalAlpha=1;
      g.fillStyle=col;g.globalAlpha=a;g.beginPath();g.arc(tx,ty-22,9,0,7);g.fill();g.globalAlpha=1;chip(x,400,lines,col,a)})}

  // ––– akcenty: PRACA · DZIECI · ZAKUPY –––
  if(E.daily){[["s02a","PRACA",C.forest],["s02b","DZIECI",C.clay],["s02c","ZAKUPY",C.forest],["s04a","ZOSTAĆ?",C.forest],["s04b","ODEJŚĆ?",C.clay],["s04c","CZEKAĆ?","#6f7f76"]].forEach(([n,word,col])=>{const q=sh(n);if(t<q[1]||t>=q[2])return;
      const x=clamp((t-q[1])/0.3),sc=0.7+0.3*easeOut(x)+0.14*Math.sin(Math.PI*x)*(1-x);g.save();g.translate(CX,432);g.rotate(-0.03);g.scale(sc,sc);g.font='700 82px "Inter V"';g.letterSpacing="9px";const w=g.measureText(word).width+96;
      g.globalAlpha=clamp(x*4);g.shadowColor="rgba(60,45,30,.3)";g.shadowBlur=34;g.shadowOffsetY=12;g.fillStyle=col;rr(-w/2,-74,w,148,38);g.fill();g.shadowColor="transparent";g.shadowBlur=0;g.shadowOffsetY=0;
      g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";g.fillText(word,4,5);g.letterSpacing="0px";g.restore();g.globalAlpha=1})}
  // ––– „kryzys?” / „koniec?” – myśli nad bezsenną głową –––
  if(E.doubt){const q=sh("s03a"),out=1-ease((t-(q[2]-0.15))/0.5);[["kryzys?",E.doubt[0],400,452,-0.06,C.clay,"#fff"],["koniec?",E.doubt[1],672,548,0.05,"#fff",C.forest]].forEach(([word,t0,x,y,rot,bg,fg],i)=>{const u=clamp((t-t0)/0.4);if(u<=0)return;
      const sc=0.6+0.4*easeOut(u)+0.16*Math.sin(Math.PI*u)*(1-u),bob=6*Math.sin(t*2.2+i*1.7);g.save();g.translate(x,y+bob);g.rotate(rot);g.scale(sc,sc);g.font='600 70px "Fraunces V"';const w=g.measureText(word).width+76;
      g.globalAlpha=out*clamp(u*3);g.shadowColor="rgba(40,40,60,.3)";g.shadowBlur=30;g.shadowOffsetY=10;g.fillStyle=bg;rr(-w/2,-62,w,124,62);g.fill();g.shadowColor="transparent";g.shadowBlur=0;g.shadowOffsetY=0;
      g.fillStyle=fg;g.textAlign="center";g.textBaseline="middle";g.fillText(word,0,2);g.restore();g.globalAlpha=1})}

  // ––– „Dlatego w DUO…”: symbol marki jak słońce nad wzgórzem –––
  if(E.brandSun&&t>=s6[1]-0.1&&t<s6[2]+0.7){const p=(t-s6[1])/(s6[2]+XF-s6[1]),rise=easeOut((t-s6[1]-0.4)/1.5),a=ease((t-s6[1]-0.35)/0.45)*(1-ease((t-s6[2])/0.6));
